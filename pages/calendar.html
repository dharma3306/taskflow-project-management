<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar | TaskFlow</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-logo">⚡</span> TaskFlow
      </div>
      <nav class="sidebar-nav">
        <a href="../index.html" class="nav-link" data-page="dashboard"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="../pages/projects.html" class="nav-link" data-page="projects"><span class="nav-icon">📁</span> Projects</a>
        <a href="../pages/tasks.html" class="nav-link" data-page="tasks"><span class="nav-icon">✅</span> Tasks <span class="nav-tag"></span></a>
        <a href="../pages/calendar.html" class="nav-link" data-page="calendar"><span class="nav-icon">📅</span> Calendar</a>
        <a href="../pages/settings.html" class="nav-link" data-page="settings"><span class="nav-icon">⚙️</span> Settings</a>
      </nav>
      <div class="sidebar-foot">
        <p>TaskFlow v1.0</p>
        <p class="muted small">Data is stored locally in your browser.</p>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
        <h1 class="page-title">Calendar</h1>
        <div class="topbar-actions">
          <button class="icon-btn" id="themeToggle" title="Toggle theme">🌙</button>
          <div class="notif-wrap">
            <button class="icon-btn" id="notifBtn" title="Notifications">🔔<span id="notifBadge" class="badge">0</span></button>
            <div id="notifPanel" class="notif-panel"></div>
          </div>
          <div class="avatar" title="User">TF</div>
        </div>
      </header>

      <main class="content">

        <div class="toolbar">
          <h2 class="cal-title" id="calTitle"></h2>
          <div class="toolbar">
            <button class="btn btn-ghost btn-sm" id="calPrev">← Prev</button>
            <button class="btn btn-ghost btn-sm" id="calToday">Today</button>
            <button class="btn btn-ghost btn-sm" id="calNext">Next →</button>
          </div>
        </div>
        <div class="card">
          <div class="cal-grid" id="calGrid"></div>
        </div>
        <div class="legend">
          <span><i class="legend-swatch" style="background:#94a3b8"></i> To Do</span>
          <span><i class="legend-swatch" style="background:#3b82f6"></i> In Progress</span>
          <span><i class="legend-swatch" style="background:#10b981"></i> Completed</span>
          <span><i class="legend-swatch" style="background:#ef4444"></i> Overdue</span>
        </div>

      </main>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/notifications.js"></script>

  <script src="../js/calendar.js"></script>
</body>
</html>
